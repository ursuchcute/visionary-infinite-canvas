# canvas.visionary.beer is an independently deployed static application.
# The aiimageoco_backend upstream is owned by the main site's blue-green
# deployment and is loaded from /etc/nginx/conf.d/aiimageoco-upstream.conf.
server {
    listen 80;
    listen [::]:80;
    server_name canvas.visionary.beer;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name canvas.visionary.beer;

    ssl_certificate /etc/letsencrypt/live/canvas.visionary.beer/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/canvas.visionary.beer/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/v-canvas;
    index index.html;
    client_max_body_size 64m;

    include /etc/nginx/snippets/visionary-canvas-security-headers.conf;

    # This is the only dynamic surface exposed on the Canvas hostname. Preserve
    # the raw child Host so the main service can enforce its child-host gate.
    location ^~ /api/canvas/v1/ {
        proxy_pass http://aiimageoco_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/visionary-canvas-security-headers.conf;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/visionary-canvas-security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/visionary-canvas-security-headers.conf;
    }
}
